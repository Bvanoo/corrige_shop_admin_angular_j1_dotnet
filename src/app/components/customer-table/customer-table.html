<table>
  <thead>
    <tr>
      <th>Nom</th>
      <th>E-mail</th>
      <th>Ville</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (customer of customers(); track customer.id) {
      <tr [class.selected]="customer.id === selectedId()">
        <td>{{ customer.firstName }} {{ customer.lastName }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.city }}</td>
        <td class="actions">
          <button type="button" (click)="selectCustomer.emit(customer.id)">
            {{ customer.id === selectedId() ? 'Masquer' : 'Commandes' }}
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4" class="empty">Aucun client.</td>
      </tr>
    }
  </tbody>
</table>
